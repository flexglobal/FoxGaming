<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mono Messenger · Relay</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3fd;color:#23365e;font:15px 'Segoe UI',Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(530px,100%);background:white;border:1px solid #dde5f7;border-radius:26px;padding:35px;box-shadow:0 22px 60px #7180b321}.mark{display:grid;place-items:center;width:60px;height:60px;background:linear-gradient(135deg,#92abff,#6677e9);color:white;border-radius:20px;font-size:28px}h1{font-size:25px;letter-spacing:-.6px;margin:20px 0 10px}p{color:#7a8ba9;line-height:1.6}.status{display:flex;align-items:center;gap:10px;margin:20px 0;padding:14px;border-radius:13px;background:#f3f6ff;color:#7081a4}.dot{height:9px;width:9px;border-radius:50%;background:#efaa57}.dot.ok{background:#3bc9a1}.links{font-size:13px;display:flex;gap:12px;flex-wrap:wrap}a{color:#5870cf}code{font-size:12px;background:#f1f4fc;padding:4px 8px;border-radius:7px}</style></head><body><div class="card"><div class="mark">M</div><h1>Mono Messenger Relay</h1><p>Сервер согласования WebRTC. Сообщения, фото, голосовые и файлы через него не пересылаются.</p><div class="status"><i id="dot" class="dot"></i><span id="label">Проверка сервера…</span></div><div class="links"><a href="/api/health">Проверка API</a><a href="/api/news">Новости Mono</a><span>Сигнализация: <code>/api/signal</code></span></div></div><script>fetch('/api/health',{cache:'no-store'}).then(async r=>{const d=await r.json();document.getElementById('label').textContent=d.signalingReady?'Готов к соединениям':'Сервер установлен, но Redis не настроен или недоступен';document.getElementById('dot').classList.toggle('ok',!!d.signalingReady)}).catch(()=>document.getElementById('label').textContent='Проверка недоступна: убедись, что API развернут');</script></body></html>
